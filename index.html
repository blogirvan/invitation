<!DOCTYPE HTML>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- 1. Meta Refresh Fallback (Executes after 0 seconds if JavaScript fails) -->
    <meta http-equiv="refresh" content="0; url=https://vanzdigital.ai.studio/">
    <title>Page Redirection</title>
    
    <!-- 2. Immediate JavaScript Redirect -->
    <script type="text/javascript">
        window.location.replace("https://vanzdigital.ai.studio/");
    </script>
</head>
<body>
    <!-- 3. Manual Fallback Link for accessibility -->
    <p>If you are not redirected automatically, follow this 
       <a href="https://vanzdigital.ai.studio/">link to the new page</a>.
    </p>
</body>
</html>
